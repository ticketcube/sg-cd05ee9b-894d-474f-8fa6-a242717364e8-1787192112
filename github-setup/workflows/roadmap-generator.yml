name: Generate Project Roadmap & Sync Project Board

# This workflow automatically generates a roadmap visualization from GitHub Issues
# AND syncs issues to project board columns based on status labels
# Runs on: Issue creation, issue updates, manual trigger, and weekly schedule

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  workflow_dispatch: # Manual trigger
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday at midnight UTC

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  # NEW JOB: Sync issue to project board when status label changes
  sync-to-project:
    runs-on: ubuntu-latest
    name: Sync Issue to Project Board
    if: github.event_name == 'issues' && (github.event.action == 'labeled' || github.event.action == 'unlabeled')
    
    steps:
      - name: Detect Status Label Change
        id: detect-status
        uses: actions/github-script@v7
        with:
          script: |
            const label = context.payload.label?.name;
            const action = context.payload.action;
            
            // Map status labels to project columns
            const statusMap = {
              'status-backlog': 'Backlog',
              'status-todo': 'To Do',
              'status-in-progress': 'In Progress',
              'status-done': 'Done'
            };
            
            // Check if this is a status label
            if (label && label.startsWith('status-')) {
              console.log(`Status label ${action}: ${label}`);
              return {
                shouldSync: true,
                statusLabel: label,
                columnName: statusMap[label],
                action: action
              };
            }
            
            return { shouldSync: false };
            
      - name: Sync to Project Board
        if: steps.detect-status.outputs.result && fromJSON(steps.detect-status.outputs.result).shouldSync
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const statusData = ${{ steps.detect-status.outputs.result }};
            const issueNumber = context.payload.issue.number;
            const issueNodeId = context.payload.issue.node_id;
            
            console.log(`Syncing issue #${issueNumber} to column: ${statusData.columnName}`);
            
            // GraphQL query to find the project and move the item
            const query = `
              query($owner: String!, $repo: String!, $issueNumber: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $issueNumber) {
                    projectItems(first: 10) {
                      nodes {
                        id
                        project {
                          id
                          title
                          fields(first: 20) {
                            nodes {
                              ... on ProjectV2SingleSelectField {
                                id
                                name
                                options {
                                  id
                                  name
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;
            
            try {
              // First, get the project items for this issue
              const result = await github.graphql(query, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issueNumber: issueNumber
              });
              
              const projectItems = result.repository.issue.projectItems.nodes;
              
              if (projectItems.length === 0) {
                console.log('Issue is not added to any project board yet');
                return;
              }
              
              // For each project this issue is in
              for (const item of projectItems) {
                const project = item.project;
                console.log(`Found in project: ${project.title}`);
                
                // Find the Status field
                const statusField = project.fields.nodes.find(
                  field => field.name === 'Status'
                );
                
                if (!statusField) {
                  console.log('No Status field found in project');
                  continue;
                }
                
                // Find the option that matches our target column
                const targetOption = statusField.options.find(
                  option => option.name === statusData.columnName
                );
                
                if (!targetOption) {
                  console.log(`Column "${statusData.columnName}" not found in project`);
                  continue;
                }
                
                // Update the project item's status
                const mutation = `
                  mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                    updateProjectV2ItemFieldValue(
                      input: {
                        projectId: $projectId
                        itemId: $itemId
                        fieldId: $fieldId
                        value: {
                          singleSelectOptionId: $optionId
                        }
                      }
                    ) {
                      projectV2Item {
                        id
                      }
                    }
                  }
                `;
                
                await github.graphql(mutation, {
                  projectId: project.id,
                  itemId: item.id,
                  fieldId: statusField.id,
                  optionId: targetOption.id
                });
                
                console.log(`✅ Moved issue #${issueNumber} to "${statusData.columnName}" in project "${project.title}"`);
              }
              
            } catch (error) {
              console.error('Error syncing to project board:', error);
              // Don't fail the workflow if project sync fails
            }
            
      - name: Comment on Issue
        if: steps.detect-status.outputs.result && fromJSON(steps.detect-status.outputs.result).shouldSync
        uses: actions/github-script@v7
        with:
          script: |
            const statusData = ${{ steps.detect-status.outputs.result }};
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🔄 Automatically moved to **${statusData.columnName}** column in project board based on \`${statusData.statusLabel}\` label.`
            });

  generate-roadmap:
    runs-on: ubuntu-latest
    name: Generate Roadmap
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Fetch Issues
        id: fetch-issues
        uses: actions/github-script@v7
        with:
          script: |
            // Fetch all issues with requirement labels
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              labels: 'requirement',
              per_page: 100
            });
            
            // Process issues into roadmap data
            const roadmapData = {
              mvp: { complete: [], inProgress: [], planned: [] },
              phase2: { complete: [], inProgress: [], planned: [] },
              phase3: { complete: [], inProgress: [], planned: [] },
              phase4: { complete: [], inProgress: [], planned: [] }
            };
            
            issues.data.forEach(issue => {
              const labels = issue.labels.map(l => l.name);
              const phase = labels.find(l => l.startsWith('phase-')) || 'phase-1';
              
              // Determine status from status labels or issue state
              let status = 'planned';
              if (labels.includes('status-done') || issue.state === 'closed') {
                status = 'complete';
              } else if (labels.includes('status-in-progress')) {
                status = 'inProgress';
              } else if (labels.includes('status-todo') || labels.includes('status-backlog')) {
                status = 'planned';
              }
              
              const phaseKey = phase === 'phase-1' ? 'mvp' 
                : phase === 'phase-2' ? 'phase2'
                : phase === 'phase-3' ? 'phase3'
                : 'phase4';
              
              roadmapData[phaseKey][status].push({
                number: issue.number,
                title: issue.title,
                priority: labels.find(l => l.startsWith('priority-')) || 'priority-p2',
                component: labels.find(l => l.includes('component-')) || 'general',
                url: issue.html_url
              });
            });
            
            return roadmapData;
            
      - name: Generate Roadmap Markdown
        id: generate-markdown
        uses: actions/github-script@v7
        with:
          script: |
            const roadmapData = ${{ steps.fetch-issues.outputs.result }};
            
            let markdown = `# 🗺️ OTW Chart - Project Roadmap
            
            > **Last Updated:** ${new Date().toISOString().split('T')[0]}
            > **Auto-generated from GitHub Issues**
            
            ## 📊 Progress Overview
            
            | Phase | Complete | In Progress | Planned | Total |
            |-------|----------|-------------|---------|-------|
            | **MVP** | ${roadmapData.mvp.complete.length} | ${roadmapData.mvp.inProgress.length} | ${roadmapData.mvp.planned.length} | ${roadmapData.mvp.complete.length + roadmapData.mvp.inProgress.length + roadmapData.mvp.planned.length} |
            | **Phase 2** | ${roadmapData.phase2.complete.length} | ${roadmapData.phase2.inProgress.length} | ${roadmapData.phase2.planned.length} | ${roadmapData.phase2.complete.length + roadmapData.phase2.inProgress.length + roadmapData.phase2.planned.length} |
            | **Phase 3** | ${roadmapData.phase3.complete.length} | ${roadmapData.phase3.inProgress.length} | ${roadmapData.phase3.planned.length} | ${roadmapData.phase3.complete.length + roadmapData.phase3.inProgress.length + roadmapData.phase3.planned.length} |
            | **Phase 4** | ${roadmapData.phase4.complete.length} | ${roadmapData.phase4.inProgress.length} | ${roadmapData.phase4.planned.length} | ${roadmapData.phase4.complete.length + roadmapData.phase4.inProgress.length + roadmapData.phase4.planned.length} |
            
            ---
            
            ## ✅ Phase 1: MVP (Q4 2025)
            
            ### Complete (${roadmapData.mvp.complete.length})
            ${roadmapData.mvp.complete.map(issue => `- [x] [#${issue.number}](${issue.url}) ${issue.title}`).join('\n') || '- None yet'}
            
            ### 🚧 In Progress (${roadmapData.mvp.inProgress.length})
            ${roadmapData.mvp.inProgress.map(issue => `- [ ] [#${issue.number}](${issue.url}) ${issue.title}`).join('\n') || '- None yet'}
            
            ### 📅 Planned (${roadmapData.mvp.planned.length})
            ${roadmapData.mvp.planned.map(issue => `- [ ] [#${issue.number}](${issue.url}) ${issue.title}`).join('\n') || '- None yet'}
            
            ---
            
            ## 🚀 Phase 2: Enhanced Engagement (Q1 2026)
            
            ### Complete (${roadmapData.phase2.complete.length})
            ${roadmapData.phase2.complete.map(issue => `- [x] [#${issue.number}](${issue.url}) ${issue.title}`).join('\n') || '- None yet'}
            
            ### 🚧 In Progress (${roadmapData.phase2.inProgress.length})
            ${roadmapData.phase2.inProgress.map(issue => `- [ ] [#${issue.number}](${issue.url}) ${issue.title}`).join('\n') || '- None yet'}
            
            ### 📅 Planned (${roadmapData.phase2.planned.length})
            ${roadmapData.phase2.planned.map(issue => `- [ ] [#${issue.number}](${issue.url}) ${issue.title}`).join('\n') || '- None yet'}
            
            ---
            
            ## 🌟 Phase 3: Social & Artist Features (Q2 2026)
            
            ### Complete (${roadmapData.phase3.complete.length})
            ${roadmapData.phase3.complete.map(issue => `- [x] [#${issue.number}](${issue.url}) ${issue.title}`).join('\n') || '- None yet'}
            
            ### 🚧 In Progress (${roadmapData.phase3.inProgress.length})
            ${roadmapData.phase3.inProgress.map(issue => `- [ ] [#${issue.number}](${issue.url}) ${issue.title}`).join('\n') || '- None yet'}
            
            ### 📅 Planned (${roadmapData.phase3.planned.length})
            ${roadmapData.phase3.planned.map(issue => `- [ ] [#${issue.number}](${issue.url}) ${issue.title}`).join('\n') || '- None yet'}
            
            ---
            
            ## 🔮 Phase 4: Scale & Expansion (Q3-Q4 2026)
            
            ### Complete (${roadmapData.phase4.complete.length})
            ${roadmapData.phase4.complete.map(issue => `- [x] [#${issue.number}](${issue.url}) ${issue.title}`).join('\n') || '- None yet'}
            
            ### 🚧 In Progress (${roadmapData.phase4.inProgress.length})
            ${roadmapData.phase4.inProgress.map(issue => `- [ ] [#${issue.number}](${issue.url}) ${issue.title}`).join('\n') || '- None yet'}
            
            ### 📅 Planned (${roadmapData.phase4.planned.length})
            ${roadmapData.phase4.planned.map(issue => `- [ ] [#${issue.number}](${issue.url}) ${issue.title}`).join('\n') || '- None yet'}
            
            ---
            
            ## 📋 Legend
            
            - ✅ **Complete**: Feature implemented and deployed
            - 🚧 **In Progress**: Currently being developed
            - 📅 **Planned**: Scheduled for development
            
            **Priority Levels:**
            - 🔴 **P0**: Critical - Must have for launch
            - 🟠 **P1**: High - Important for core experience
            - 🟡 **P2**: Medium - Valuable but not essential
            - 🟢 **P3**: Low - Nice to have
            
            **Status Labels:**
            - \`status-backlog\`: In backlog (maps to "Backlog" column)
            - \`status-todo\`: Ready to start (maps to "To Do" column)
            - \`status-in-progress\`: Currently being worked on (maps to "In Progress" column)
            - \`status-done\`: Completed (maps to "Done" column)
            
            ---
            
            _This roadmap is automatically generated from GitHub Issues. To update, create or modify issues with the \`requirement\` label and appropriate phase/status labels._
            _Issues are automatically moved to the correct project board column when status labels are added/changed._
            `;
            
            return markdown;
            
      - name: Update ROADMAP.md
        run: |
          echo '${{ steps.generate-markdown.outputs.result }}' > ROADMAP.md
          
      - name: Commit Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md
          git diff --quiet && git diff --staged --quiet || git commit -m "🗺️ Auto-update roadmap from issues"
          git push
          
      - name: Comment on Issue (if triggered by issue)
        if: github.event_name == 'issues' && github.event.action != 'labeled' && github.event.action != 'unlabeled'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ Roadmap has been automatically updated to reflect this change! View it here: [ROADMAP.md](../ROADMAP.md)'
            });
